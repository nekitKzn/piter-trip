    }

    const map = L.map('map', {zoomControl:false, preferCanvas:true}).setView([59.94,30.31], 12);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }).addTo(map);

    let current = 0;
    let routeLayer = L.layerGroup().addTo(map);
    let markers = [];
    let bounds = null;

    const tabs = document.getElementById('dayTabs');
    days.forEach((day,index)=>{
      const btn = document.createElement('button');
      btn.className='day-btn';
      btn.type='button';
      btn.role='tab';
      btn.innerHTML=`<span class="dot" style="color:${day.color}"></span><span><b>${day.tab}</b><small>${day.date}</small></span>`;
      btn.addEventListener('click',()=>renderDay(index));
      tabs.appendChild(btn);
    });

    const legend = L.control({position:'topright'});
    legend.onAdd = () => {
      const el=L.DomUtil.create('div','legend');
      el.innerHTML='<div class="legend-row"><span class="legend-line"></span>пешком</div><div class="legend-row"><span class="legend-line dash"></span>транспорт</div>';
      return el;
    };
    legend.addTo(map);

    function yandexUrl(point){
      return `https://yandex.ru/maps/?pt=${point.coords[1]},${point.coords[0]}&z=16&l=map`;
    }
    function googleUrl(point){
      return `https://www.google.com/maps/search/?api=1&query=${point.coords[0]},${point.coords[1]}`;
    }
    function icon(color,n){
      return L.divIcon({
        className:'number-icon', iconSize:[34,40], iconAnchor:[17,38], popupAnchor:[0,-37],
        html:`<div class="map-pin" style="background:${color}"><span>${n}</span></div>`
      });
    }
    function popup(day,point){
      return `<div style="--active:${day.color}"><div class="pop-time">${point.time}${point.mode ? ' · '+modes[point.mode].label : ''}</div><div class="pop-title">${point.name}</div><div class="pop-address">${point.desc}<br><br>${point.address}</div><div class="pop-actions"><a href="${yandexUrl(point)}" target="_blank" rel="noopener">Яндекс Карты</a><a href="${googleUrl(point)}" target="_blank" rel="noopener">Google Maps</a></div></div>`;
    }
    function renderDay(index){
      current=index;
      const day=days[index];
      document.documentElement.style.setProperty('--active',day.color);
      [...tabs.children].forEach((el,i)=>{
        el.setAttribute('aria-selected',String(i===index));
        el.style.background=i===index ? day.color : '#fff';
        if(i!==index) el.querySelector('.dot').style.color=days[i].color;
      });
      document.getElementById('summary').innerHTML=`
        <div class="day-kicker"><span>${day.tab}</span><span>·</span><span>${day.date}</span></div>
        <h2 class="day-title">${day.title}</h2>
        <p class="day-note">${day.note}</p>
        <div class="metrics">${day.metrics.map((m,i)=>`<div class="metric"><b>${m}</b><span>${['точки','пешком','время'][i]}</span></div>`).join('')}</div>`;
      routeLayer.clearLayers(); markers=[];
      const pts=day.points;
      for(let i=1;i<pts.length;i++){
        const mode=pts[i].mode || 'walk';
        L.polyline([pts[i-1].coords,pts[i].coords],{
          color:day.color, weight:4, opacity:.8, dashArray:modes[mode].dash, lineCap:'round'
        }).addTo(routeLayer);
      }
      pts.forEach((pt,i)=>{
        const marker=L.marker(pt.coords,{icon:icon(day.color,i+1),title:pt.name}).bindPopup(popup(day,pt));
        marker.addTo(routeLayer); markers.push(marker);
      });
      bounds=L.latLngBounds(pts.map(x=>x.coords));
      fitRoute();
      const timeline=document.getElementById('timeline');
      timeline.innerHTML=pts.map((pt,i)=>`
        <li class="stop">
          <div class="stop-marker">${i+1}</div>
          <div class="stop-card" tabindex="0" data-index="${i}" role="button" aria-label="Показать ${pt.name} на карте">
            <div class="stop-top"><span class="stop-time">${pt.time}</span><span class="mode">${pt.mode ? modes[pt.mode].icon+' '+modes[pt.mode].label : 'старт'}</span></div>
            <div class="stop-name">${pt.name}</div><p class="stop-desc">${pt.desc}</p>
          </div>
        </li>`).join('');
      timeline.querySelectorAll('.stop-card').forEach(card=>{
        const open=()=>focusPoint(Number(card.dataset.index));
        card.addEventListener('click',open);
        card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
      });
      document.getElementById('panel').scrollTop=0;
      setTimeout(()=>map.invalidateSize(),80);
    }
    function fitRoute(){
      if(!bounds) return;
      const mobile=window.matchMedia('(max-width:780px)').matches;
      map.fitBounds(bounds,{paddingTopLeft:[28,28],paddingBottomRight:mobile?[28,250]:[35,35],maxZoom:15});
    }
    function focusPoint(i){
      const point=days[current].points[i];
      const mobile=window.matchMedia('(max-width:780px)').matches;
      map.setView(point.coords,mobile?15:16,{animate:true});
      markers[i].openPopup();
    }
    document.getElementById('fitBtn').addEventListener('click',fitRoute);
    document.getElementById('hotelBtn').addEventListener('click',()=>{
      const i=days[current].points.findIndex(x=>x.coords[0]===HOTEL[0]&&x.coords[1]===HOTEL[1]);
      focusPoint(i<0?0:i);
    });
    document.getElementById('shareBtn').addEventListener('click',async()=>{
      const payload={title:'Петербург · маршруты на 4 дня',text:'Наш маршрут по Санкт-Петербургу на 24–27 сентября 2026',url:location.href};
      try{ if(navigator.share){await navigator.share(payload);} else {await navigator.clipboard.writeText(location.href); alert('Ссылка скопирована');} }catch(e){}
    });
    window.addEventListener('resize',()=>{map.invalidateSize();});
    renderDay(0);
  </script>
</body>
</html>
